<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-a: #d9f0e6;
    --bg-b: #e4dcf7;
    --card: #fffafc;
    --ink: #4a3f6b;
    --btn: #8f7fd6;
    --btn-ink: #ffffff;
    --focus: #4a3f6b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-a: #26352f;
      --bg-b: #2d2842;
      --card: #353049;
      --ink: #f0eaff;
      --btn: #b3a5f0;
      --btn-ink: #2b2445;
      --focus: #f0eaff;
    }
  }
  :root[data-theme="dark"] {
    --bg-a: #26352f;
    --bg-b: #2d2842;
    --card: #353049;
    --ink: #f0eaff;
    --btn: #b3a5f0;
    --btn-ink: #2b2445;
    --focus: #f0eaff;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-a);
    background: linear-gradient(145deg, var(--bg-a), var(--bg-b));
    color: var(--ink);
    font-family: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 36px;
    padding: clamp(36px, 8vw, 72px) clamp(28px, 7vw, 80px);
    max-width: 100%;
    text-align: center;
    box-shadow: 0 18px 50px rgba(74, 63, 107, 0.15);
  }
  h1 {
    margin: 0 0 32px;
    font-weight: 600;
    font-size: clamp(2.6rem, 11vw, 5.5rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  button {
    font: inherit;
    font-weight: 500;
    font-size: 1.15rem;
    color: var(--btn-ink);
    background: var(--btn);
    border: 0;
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Hello, world</h1>
    <button type="button">Say hi back</button>
  </main>
</body>
</html>
